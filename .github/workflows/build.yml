name: Build ImmortalWrt AC2100

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget time autoconf automake libtool gperf

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --single-branch -b openwrt-25.12 \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Add PassWall feeds
        run: |
          cd openwrt
          echo 'src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main' >> feeds.conf.default
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cd openwrt
          cp ../config.seed .config
          make defconfig

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ac2100
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
          if-no-files-found: error
